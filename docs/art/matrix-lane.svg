<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 564" width="960" height="564" font-family="Hanken Grotesk, Segoe UI, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Eight stages of the workspace matrix: walk, git config, remote, duplicates, surface, public, developer, status. Every directory under the given root is walked once, skipping the same build and cache names the single sweep skips. A repository is recognised by a readable git config file. Only a remote that parses as a GitHub slug is kept, so a local-only checkout is passed over. When two checkouts share a slug the shallower path wins, and a mirror directory loses on purpose. Each surviving repository is scanned across its named files, its workflows and its docs, rather than its whole tree. Six rules decide the public verdict. Four more decide the developer verdict. The overall status is the worst of the three verdicts rather than an average of them, so one drift is enough. Three outcomes: match, drift, and unverifiable."><style>
  :root{ --void:#f4f3ef; --bone:#0b0c0e; --muted:#43474e;
    --hairline:rgba(11,12,14,.16); --card:rgba(255,255,255,.66);
    --verified:#1f7a52; --drift:#3a2bd6; }
  @media (prefers-color-scheme: dark){
    :root{ --void:#0b0e0f; --bone:#eef1ee; --muted:#9aa39c;
      --hairline:rgba(238,241,238,.18); --card:rgba(255,255,255,.05);
      --verified:#5fae93; --drift:#a99cf5; } }
  .bg{ fill:var(--void); }
  .card{ fill:var(--card); stroke:var(--hairline); stroke-width:1.4; }
  .n{ fill:var(--bone); font-size:15px; font-weight:650; }
  .s{ fill:var(--muted); font-size:11.5px; }
  .k{ fill:var(--muted); font-size:11px; letter-spacing:.16em; }
  .h{ fill:var(--bone); font-size:21px; font-weight:700; }
  .fwd{ stroke:var(--verified); stroke-width:2; fill:none; }
  .back{ stroke:var(--drift); stroke-width:1.8; fill:none; stroke-dasharray:5 4; }
  .thin{ stroke:var(--hairline); stroke-width:1.4; fill:none; }
  .step{ fill:var(--muted); font-size:11px; font-weight:700; letter-spacing:.1em; }
</style><marker id="af" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--verified)"/></marker><marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--drift)"/></marker><rect class="bg" width="960" height="564"/><text class="k" x="44" y="40" font-family="Conso, ui-monospace, Cascadia Mono, Consolas, monospace">MANY REPOSITORIES, ONE TABLE</text><text class="h" x="44" y="72">How a workspace of repositories is reduced to one verdict each</text><path class="fwd" marker-end="url(#af)" d="M246.5 158H261.5"/><path class="fwd" marker-end="url(#af)" d="M471 158H486"/><path class="fwd" marker-end="url(#af)" d="M695.5 158H710.5"/><path class="fwd" marker-end="url(#af)" d="M920 158H940V276H20V350H37"/><path class="fwd" marker-end="url(#af)" d="M246.5 350H261.5"/><path class="fwd" marker-end="url(#af)" d="M471 350H486"/><path class="fwd" marker-end="url(#af)" d="M695.5 350H710.5"/><path class="back" marker-end="url(#ab)" d="M816.75 398V420H143.25V405"/><text class="k" x="480" y="437" text-anchor="middle" fill="var(--drift)">THE THIRD VERDICT READS THE SAME FINDINGS</text><g><rect class="card" x="44" y="110" width="198.5" height="96" rx="3"/><text class="step" x="58" y="101">01</text><text class="n" x="58" y="142">Walk</text><text class="s" x="58" y="168">Every directory under the</text><text class="s" x="58" y="183">root, once.</text></g><g><rect class="card" x="268.5" y="110" width="198.5" height="96" rx="3"/><text class="step" x="282.5" y="101">02</text><text class="n" x="282.5" y="142">Git config</text><text class="s" x="282.5" y="168">A repository is a readable git</text><text class="s" x="282.5" y="183">config.</text></g><g><rect class="card" x="493" y="110" width="198.5" height="96" rx="3"/><text class="step" x="507" y="101">03</text><text class="n" x="507" y="142">Remote</text><text class="s" x="507" y="168">Only a GitHub remote is kept.</text></g><g><rect class="card" x="717.5" y="110" width="198.5" height="96" rx="3"/><text class="step" x="731.5" y="101">04</text><text class="n" x="731.5" y="142">Duplicates</text><text class="s" x="731.5" y="168">One checkout per remote, the</text><text class="s" x="731.5" y="183">shallowest.</text></g><g><rect class="card" x="44" y="302" width="198.5" height="96" rx="3"/><text class="step" x="58" y="293">05</text><text class="n" x="58" y="334">Surface</text><text class="s" x="58" y="360">Named files, workflows and</text><text class="s" x="58" y="375">docs only.</text></g><g><rect class="card" x="268.5" y="302" width="198.5" height="96" rx="3"/><text class="step" x="282.5" y="293">06</text><text class="n" x="282.5" y="334">Public</text><text class="s" x="282.5" y="360">Six rules decide the public</text><text class="s" x="282.5" y="375">verdict.</text></g><g><rect class="card" x="493" y="302" width="198.5" height="96" rx="3"/><text class="step" x="507" y="293">07</text><text class="n" x="507" y="334">Developer</text><text class="s" x="507" y="360">Four more decide the second</text><text class="s" x="507" y="375">verdict.</text></g><g><rect class="card" x="717.5" y="302" width="198.5" height="96" rx="3"/><text class="step" x="731.5" y="293">08</text><text class="n" x="731.5" y="334">Status</text><text class="s" x="731.5" y="360">The worst verdict wins.</text><text class="s" x="731.5" y="375">Nothing averages.</text></g><path class="thin" d="M816.75 398V448"/><path class="thin" d="M816.75 448H180.67V472"/><rect x="44" y="472" width="273.33" height="46" rx="3" fill="none" stroke="var(--verified)" stroke-width="1.6"/><text class="n" x="58" y="493" font-size="13">MATCH</text><text class="s" x="58" y="509" font-size="10.5">all three verdicts came back clean</text><path class="thin" d="M816.75 448H480V472"/><rect x="343.33" y="472" width="273.33" height="46" rx="3" fill="none" stroke="var(--drift)" stroke-width="1.6"/><text class="n" x="357.33" y="493" font-size="13">DRIFT</text><text class="s" x="357.33" y="509" font-size="10.5">at least one verdict did not</text><path class="thin" d="M816.75 448H779.33V472"/><rect x="642.67" y="472" width="273.33" height="46" rx="3" fill="none" stroke="var(--muted)" stroke-width="1.6"/><text class="n" x="656.67" y="493" font-size="13">UNVERIFIABLE</text><text class="s" x="656.67" y="509" font-size="10.5">the surface could not be read at all</text><text class="s" x="44" y="546">The matrix carries no absolute path, no value that any rule matched, and no result of any network call. It is a table of verdicts and counts.</text></svg>
