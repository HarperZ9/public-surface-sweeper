<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 564" width="960" height="564" font-family="Hanken Grotesk, Segoe UI, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Eight stages of a single sweep: root, skip list, readable, punctuation, required, contract, credentials, filters. The walk starts at the repository root and covers everything under it. Twenty five directory names are never entered, among them the virtual environment, the build output and the caches. A file is read only if it decodes as UTF-8, holds no null byte, and is under a megabyte. An em dash anywhere in a scanned file is an error rather than a note. Four files have to be present at the root by name. Five further rules ask whether the release surface is inspectable at all: a changelog, funding metadata, agent instructions, usage docs and a workflow. Five known credential shapes are matched by their own patterns, then a generic name-equals-value rule catches the rest. Two filters drop candidates before they are counted: a span a provider rule already claimed, and a value that reads as a placeholder. Three outcomes: ready, needs polish, and blocked."><style>
  :root{ --void:#f4f3ef; --bone:#0b0c0e; --muted:#43474e;
    --hairline:rgba(11,12,14,.16); --card:rgba(255,255,255,.66);
    --verified:#1f7a52; --drift:#3a2bd6; }
  @media (prefers-color-scheme: dark){
    :root{ --void:#0b0e0f; --bone:#eef1ee; --muted:#9aa39c;
      --hairline:rgba(238,241,238,.18); --card:rgba(255,255,255,.05);
      --verified:#5fae93; --drift:#a99cf5; } }
  .bg{ fill:var(--void); }
  .card{ fill:var(--card); stroke:var(--hairline); stroke-width:1.4; }
  .n{ fill:var(--bone); font-size:15px; font-weight:650; }
  .s{ fill:var(--muted); font-size:11.5px; }
  .k{ fill:var(--muted); font-size:11px; letter-spacing:.16em; }
  .h{ fill:var(--bone); font-size:21px; font-weight:700; }
  .fwd{ stroke:var(--verified); stroke-width:2; fill:none; }
  .back{ stroke:var(--drift); stroke-width:1.8; fill:none; stroke-dasharray:5 4; }
  .thin{ stroke:var(--hairline); stroke-width:1.4; fill:none; }
  .step{ fill:var(--muted); font-size:11px; font-weight:700; letter-spacing:.1em; }
</style><marker id="af" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--verified)"/></marker><marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--drift)"/></marker><rect class="bg" width="960" height="564"/><text class="k" x="44" y="40" font-family="Conso, ui-monospace, Cascadia Mono, Consolas, monospace">ONE REPOSITORY, ONE SCORE</text><text class="h" x="44" y="72">What a sweep reads before it says a repository is ready</text><path class="fwd" marker-end="url(#af)" d="M246.5 158H261.5"/><path class="fwd" marker-end="url(#af)" d="M471 158H486"/><path class="fwd" marker-end="url(#af)" d="M695.5 158H710.5"/><path class="fwd" marker-end="url(#af)" d="M920 158H940V276H20V350H37"/><path class="fwd" marker-end="url(#af)" d="M246.5 350H261.5"/><path class="fwd" marker-end="url(#af)" d="M471 350H486"/><path class="fwd" marker-end="url(#af)" d="M695.5 350H710.5"/><path class="back" marker-end="url(#ab)" d="M816.75 398V420H592.25V405"/><text class="k" x="704.5" y="437" text-anchor="middle" fill="var(--drift)">A DROPPED MATCH NEVER REACHES THE SCORE</text><g><rect class="card" x="44" y="110" width="198.5" height="96" rx="3"/><text class="step" x="58" y="101">01</text><text class="n" x="58" y="142">Root</text><text class="s" x="58" y="168">One repository, walked from</text><text class="s" x="58" y="183">the top.</text></g><g><rect class="card" x="268.5" y="110" width="198.5" height="96" rx="3"/><text class="step" x="282.5" y="101">02</text><text class="n" x="282.5" y="142">Skip list</text><text class="s" x="282.5" y="168">Twenty five directories are</text><text class="s" x="282.5" y="183">never read.</text></g><g><rect class="card" x="493" y="110" width="198.5" height="96" rx="3"/><text class="step" x="507" y="101">03</text><text class="n" x="507" y="142">Readable</text><text class="s" x="507" y="168">Text only, under a megabyte,</text><text class="s" x="507" y="183">no nulls.</text></g><g><rect class="card" x="717.5" y="110" width="198.5" height="96" rx="3"/><text class="step" x="731.5" y="101">04</text><text class="n" x="731.5" y="142">Punctuation</text><text class="s" x="731.5" y="168">An em dash is an error, not a</text><text class="s" x="731.5" y="183">note.</text></g><g><rect class="card" x="44" y="302" width="198.5" height="96" rx="3"/><text class="step" x="58" y="293">05</text><text class="n" x="58" y="334">Required</text><text class="s" x="58" y="360">Four files must be present by</text><text class="s" x="58" y="375">name.</text></g><g><rect class="card" x="268.5" y="302" width="198.5" height="96" rx="3"/><text class="step" x="282.5" y="293">06</text><text class="n" x="282.5" y="334">Contract</text><text class="s" x="282.5" y="360">Five more make the surface</text><text class="s" x="282.5" y="375">inspectable.</text></g><g><rect class="card" x="493" y="302" width="198.5" height="96" rx="3"/><text class="step" x="507" y="293">07</text><text class="n" x="507" y="334">Credentials</text><text class="s" x="507" y="360">Five known shapes, then</text><text class="s" x="507" y="375">generic pairs.</text></g><g><rect class="card" x="717.5" y="302" width="198.5" height="96" rx="3"/><text class="step" x="731.5" y="293">08</text><text class="n" x="731.5" y="334">Filters</text><text class="s" x="731.5" y="360">A claimed span or a</text><text class="s" x="731.5" y="375">placeholder is dropped.</text></g><path class="thin" d="M816.75 398V448"/><path class="thin" d="M816.75 448H180.67V472"/><rect x="44" y="472" width="273.33" height="46" rx="3" fill="none" stroke="var(--verified)" stroke-width="1.6"/><text class="n" x="58" y="493" font-size="13">READY</text><text class="s" x="58" y="509" font-size="10.5">nothing was raised at any severity</text><path class="thin" d="M816.75 448H480V472"/><rect x="343.33" y="472" width="273.33" height="46" rx="3" fill="none" stroke="var(--muted)" stroke-width="1.6"/><text class="n" x="357.33" y="493" font-size="13">NEEDS POLISH</text><text class="s" x="357.33" y="509" font-size="10.5">warnings only, and it still exits zero</text><path class="thin" d="M816.75 448H779.33V472"/><rect x="642.67" y="472" width="273.33" height="46" rx="3" fill="none" stroke="var(--drift)" stroke-width="1.6"/><text class="n" x="656.67" y="493" font-size="13">BLOCKED</text><text class="s" x="656.67" y="509" font-size="10.5">one error, and the command exits one</text><text class="s" x="44" y="546">Every rule reads a file that is already on disk. Nothing is fetched, nothing is written, and no rule reports a value it found.</text></svg>
